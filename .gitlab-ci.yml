# .gitlab-ci.yml
image: debian:stable-slim

build:arm64:
  image: ubuntu:22.04
  stage: build
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends ca-certificates cmake build-essential git \
        gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
    - mkdir -p build && cd build
  script:
    - cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=/usr/bin/aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=/usr/bin/aarch64-linux-gnu-g++
    - cmake --build . -- -j$(nproc)
  artifacts:
    paths:
      - build/qilab
