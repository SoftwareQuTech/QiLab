# .gitlab-ci.yml
image: debian:stable-slim

build:arm64:
  # Use native aarch64 Debian image (requires runner with arm64 support or qemu)
  image: arm64v8/debian:stable-slim
  stage: build
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends ca-certificates cmake build-essential git
    - mkdir -p build && cd build
  script:
    # Native aarch64 build using system gcc/g++
    - cmake .. -DCMAKE_BUILD_TYPE=Release
    - cmake --build . -- -j$(nproc)
  artifacts:
    paths:
      - build/
    expire_in: 1 hour

# Host build + tests: uses the CI runner's native GCC (no cross-compiler required)
test:host:
  image: ubuntu:22.04
  stage: test
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends ca-certificates cmake build-essential git
    - mkdir -p build && cd build
  script:
    - cd build || exit 1
    - cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=/usr/bin/gcc -DCMAKE_CXX_COMPILER=/usr/bin/g++
    - cmake --build . -- -j$(nproc)
    - echo "Running host ctest and producing junit report..."
    - ctest --output-on-failure --parallel $(nproc) --output-junit junit.xml || true
  artifacts:
    reports:
      junit: build/junit.xml
    paths:
      - build/junit.xml
    when: always
