# .gitlab-ci.yml
image: ubuntu:22.04

stages:
  - build
  - test
  - coverage
  - release

variables:
  DEBIAN_FRONTEND: noninteractive

build:
  stage: build
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends ca-certificates cmake build-essential git
    - mkdir -p build && cd build
  script:
    - cmake .. -DCMAKE_BUILD_TYPE=Release 
        -DCMAKE_C_COMPILER=/usr/bin/gcc 
        -DCMAKE_CXX_COMPILER=/usr/bin/g++ 
        -DCMAKE_CXX_FLAGS="--coverage" 
        -DCMAKE_C_FLAGS="--coverage"
        -DQILAB_CI_TAG=${CI_COMMIT_TAG}
        -DBUILD_TESTING=ON
    - cmake --build . -- -j$(nproc)
  artifacts:
    paths:
      - build/test/*_tests           # Only your test executables
      - build/**/*.gcno
      - build/CMakeCache.txt
    exclude:
      - build/_deps/
    expire_in: 1 hour

test:
  stage: test
  dependencies:
    - build
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends ca-certificates cmake build-essential git
    - cd build
    - cmake .. -DCMAKE_BUILD_TYPE=Release 
      -DCMAKE_C_COMPILER=/usr/bin/gcc 
      -DCMAKE_CXX_COMPILER=/usr/bin/g++ 
      -DCMAKE_CXX_FLAGS="--coverage" 
      -DCMAKE_C_FLAGS="--coverage"
      -DQILAB_CI_TAG=${CI_COMMIT_TAG}
      -DBUILD_TESTING=ON
    # Rebuild only Stim if needed as stim is 1gb and too big to be an artifact
    - cmake --build . -- -j$(nproc)
  script:
    - ctest --output-on-failure --parallel $(nproc) --output-junit junit.xml
  artifacts:
    reports:
      junit: build/junit.xml
    paths:
      - build/**/*.gcda
      - build/**/*.gcno
    exclude:
      - build/_deps/
    when: always

coverage:
  stage: coverage
  dependencies:
    - test
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends lcov
  script:
    - cd build
    # Capture coverage data
    - lcov --capture --directory . --output-file coverage.info
    # Remove system headers and test files from coverage
    - lcov --remove coverage.info '/usr/*' '*/test/*' '*/googletest/*' '*/gmock/*' 'src/gmock*' '*/gmock*' --output-file coverage_filtered.info
    # Generate HTML report
    - genhtml coverage_filtered.info --output-directory coverage_html
    # Print summary
    - lcov --list coverage_filtered.info
    # Move to public directory for GitLab Pages
    - mkdir -p ../public
    - mv coverage_html/* ../public/
  coverage: '/lines\.*: \d+\.\d+%/'
  artifacts:
    paths:
      - public
      - build/coverage_filtered.info
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage.xml

pages:
  stage: coverage
  dependencies:
    - coverage
  script:
    - echo "Deploying coverage report to GitLab Pages"
  artifacts:
    paths:
      - public

release_mvp:
  stage: release
  before_script:
    - apt-get update -y
    - apt-get install -y --no-install-recommends ca-certificates cmake git gcc-aarch64-linux-gnu g++-aarch64-linux-gnu file
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=/usr/bin/aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=/usr/bin/aarch64-linux-gnu-g++ -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DQILAB_CI_TAG=${CI_COMMIT_TAG} -DBUILD_TESTING=OFF
    - cmake --build build-release --target qilab -- -j$(nproc)
    - file build-release/qilab | tee build-release/binary_arch.txt
    - grep -E "aarch64|ARM aarch64" build-release/binary_arch.txt
    - mkdir -p "dist/qilab-${VERSION}"
    - cp build-release/qilab "dist/qilab-${VERSION}/"
    - cp README.md "dist/qilab-${VERSION}/"
    - if [ -f docs/config_example.yaml ]; then cp docs/config_example.yaml "dist/qilab-${VERSION}/config_example.yaml"; fi
    - tar -czf "dist/qilab-${VERSION}-linux-arm64.tar.gz" -C dist "qilab-${VERSION}"
  artifacts:
    paths:
      - dist/*-linux-arm64.tar.gz
      - build-release/binary_arch.txt
    expire_in: 1 month
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never